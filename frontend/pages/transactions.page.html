<div class="page">

  <div class="section">
    <h2>Recent Transactions</h2>

    <!-- Add Transaction Button -->
    <button id="add-transaction-btn" class="add-tx-btn">+ Add Transaction</button>

    <!-- Transaction List -->
    <div id="transaction-list">Loading...</div>
  </div>

  <!-- BACKDROP -->
  <div id="sheet-backdrop" class="backdrop hidden"></div>

  <!-- TRANSACTION SHEET -->
  <div id="transaction-sheet" class="sheet hidden">
    <div class="sheet-handle"></div>

    <div class="sheet-content">
      <h3 style="margin-top: 0;">Add Transaction</h3>

      <label>Name</label>
      <input id="tx-name" type="text" placeholder="Store / Merchant" required>

      <label>Amount</label>
      <input id="tx-amount" type="number" placeholder="0.00" step="0.01" required>

      <label>Date</label>
      <input id="tx-date" type="date" required>

      <label>Category / Envelope</label>
      <select id="tx-target" required>
        <option value="">Select a category...</option>
      </select>

      <!-- NEW SWITCH -->
      <label class="switch-row">
        <span>Ignore</span>
        <button id="tx-ignore-switch" class="switch-btn" data-state="off">Off</button>
      </label>

      <div class="sheet-actions">
        <button id="tx-save" type="button" class="sheet-btn-save">Save</button>
        <button id="tx-cancel" type="button" class="sheet-btn-cancel">Cancel</button>
      </div>

    </div>
  </div>

</div>
