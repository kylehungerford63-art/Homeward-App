<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
  <link rel="apple-touch-icon" sizes="76x76" href="/icons/icon-76.png">
  <link rel="manifest" href="/manifest.json">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0b5cff">

  <meta charset="UTF-8" />
  <title>Homeward</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="app-shell">

    <div class="header-wrapper">

      <div class="header">
        <div class="header-left">
          <div class="header-logo glow-wrap">
            <img src="assets/icon.png" class="logo-img">
          </div>
        </div>

        <div class="header-title">Homeward</div>

        <!-- PROFILE CIRCLE + DROPDOWN -->
        <div class="header-profile">
          <div id="profile-circle" class="profile-circle">KP</div>

          <div id="profile-menu" class="profile-menu" style="display:none;">
            <div id="profile-user-label" class="profile-user-label">Guest</div>
            <button id="menu-login" class="profile-menu-item">Log in</button>
            <button id="menu-register" class="profile-menu-item">Create account</button>
            <button id="menu-logout" class="profile-menu-item">Logout</button>
          </div>
        </div>
      </div>

      <nav class="header-nav">
        <div class="nav-scroll">
          <span class="nav-item" data-page="dashboard">Dashboard</span>
          <span class="nav-item" data-page="budget">Budget</span>
          <span class="nav-item" data-page="transactions">Transactions</span>
          <span class="nav-item" data-page="goals">House Goal</span>
          <span class="nav-item" data-page="insights">Insights</span>
        </div>

        <div class="nav-highlight"></div>
      </nav>

    </div>

    <div class="app-container"></div>

  </div>

  <script type="module" src="js/app.js"></script>

  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
</body>
</html>
